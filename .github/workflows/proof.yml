name: Proof of Work

# Aktualisiert proof.json (GitHub-Contribution-Heatmap + kuratierter Ship-Feed)
# taeglich automatisch. Der Bot-Commit zaehlt NICHT auf Jasons Contribution-Graph
# (Attribution: github-actions[bot]) -> keine gefaketen Zahlen.

on:
  schedule:
    - cron: '17 5 * * *'        # taeglich 05:17 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_proof.py'
      - '.github/workflows/proof.yml'

permissions:
  contents: write

concurrency:
  group: main-schreiben        # gemeinsam mit stand.yml: nie zwei Bot-Pushes gleichzeitig
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build proof.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: JasonRoschmann
        run: python3 scripts/build_proof.py
      - name: Commit wenn geaendert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof.json
          if git diff --cached --quiet; then
            echo "proof.json unveraendert - kein Commit"
          else
            git commit -m "chore: refresh proof.json [skip ci]"
            git pull --rebase -q && git push
          fi
