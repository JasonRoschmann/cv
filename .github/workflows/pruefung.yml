name: Prüfung

# Baut alle PDFs frisch unter Linux und prüft sie: Seitenzahl, Pflichtangaben, PR-Zahlen aus
# pr-stand.json, Links, Schriften. Läuft bei jedem PR, täglich und von Hand – nicht bei Push auf
# main (dort stempelt zuerst stand.yml, sonst wäre der Stand kurz rot).

on:
  pull_request:
  schedule:
    - cron: '10 7 * * *'        # täglich 07:10 UTC, nach Zähler (05:40) und Stand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci_setup.sh
      - name: Selbsttests
        run: for t in scripts/test_*.py; do python3 "$t"; done
      - name: Zahlen in allen Fassungen = pr-stand.json
        run: python3 scripts/stand.py pruefen
      - name: Zählung höchstens 3 Tage alt
        if: github.event_name == 'schedule'
        run: python3 scripts/stand.py frische 3
      - run: python3 scripts/build_cv_pdf.py
      - run: python3 scripts/cv_pruefung.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pdfs
          path: |
            *.pdf
            ats-cv/*.pdf
          retention-days: 7
